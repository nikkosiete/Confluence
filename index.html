<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSI Updates Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#172b4d;--mut:#5e6c84;--bd:#dfe1e6;--ac:#0052cc;--acbg:#deebff;--hd:#172b4d;--hdtx:#fff;--ok:#006644;--okbg:#e3fcef;--bad:#bf2600;--badbg:#ffebe6;--hov:#f4f5f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101418;--card:#1a2027;--tx:#dde3ea;--mut:#8f9bad;--bd:#2c3540;--ac:#6a9fff;--acbg:#1c2c4a;--hd:#0b0e12;--hdtx:#e8ecf2;--ok:#6fdc9f;--okbg:#14301f;--bad:#ff8f73;--badbg:#3d1d17;--hov:#212932}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101418;--card:#1a2027;--tx:#dde3ea;--mut:#8f9bad;--bd:#2c3540;--ac:#6a9fff;--acbg:#1c2c4a;--hd:#0b0e12;--hdtx:#e8ecf2;--ok:#6fdc9f;--okbg:#14301f;--bad:#ff8f73;--badbg:#3d1d17;--hov:#212932}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
.top{background:var(--hd);color:var(--hdtx);display:flex;align-items:center;gap:12px;padding:0 20px;height:52px}
.logo{width:28px;height:28px;border-radius:4px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.top .name{font-weight:600;font-size:15px}
.top .crumb{opacity:.65;font-size:13px}
#signin{margin-left:auto}.top button{background:transparent;color:var(--hdtx);border-color:rgba(255,255,255,.35)}.top button.pri{background:var(--ac);border-color:var(--ac);color:#fff}.top button:hover{filter:brightness(1.15)}
.shell{max-width:1120px;margin:0 auto;padding:24px 20px 56px;display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
.side{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:16px}
.side h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 12px;font-weight:700}
.side label,#form label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.side label:first-of-type{margin-top:0}
.side input,.side select,#form input,#form textarea,#form select{width:100%}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:3px;padding:7px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:-1px}
button{cursor:pointer;font-weight:600}
button:hover{background:var(--hov)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.pri:hover{filter:brightness(.92)}
.side button{width:100%;margin-top:16px}
.main h1{font-size:24px;font-weight:600;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.count{color:var(--mut);font-size:13px;padding-bottom:10px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:4px;padding:16px 20px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--mut);font-size:12px;margin-bottom:10px}
.tag{background:var(--acbg);color:var(--ac);border-radius:3px;padding:1px 8px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.ver{border:1px solid var(--bd);border-radius:3px;padding:0 6px}
.latest{background:var(--okbg);color:var(--ok);border-radius:3px;padding:1px 8px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.det{white-space:pre-wrap;overflow-wrap:anywhere}
.act{margin-top:12px;display:flex;gap:8px}
.card button{padding:3px 10px;font-size:12px}
a{color:var(--ac)}
#login,#form{display:none;margin-bottom:16px;border-left-color:var(--ac)}
textarea{min-height:120px;resize:vertical}
.empty,.note{color:var(--mut);text-align:center;padding:32px 0;background:var(--card);border:1px dashed var(--bd);border-radius:4px}
mark{background:#ffe58a;color:#172b4d;border-radius:2px}
.hist{margin-top:12px;border-top:1px solid var(--bd);padding-top:10px;font-size:13px}
.hist .h{margin-bottom:10px;color:var(--mut)}
.hist b{color:var(--tx)}

.tabbar{background:var(--card);border-bottom:1px solid var(--bd)}
.tabin{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;gap:4px}
.tabin button.tab{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 16px;color:var(--mut);margin-left:0}
.tabin button.tab:hover{color:var(--tx);background:none}
.tabin button.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.good{background:var(--okbg);color:var(--ok)}
.shell1{max-width:860px;margin:0 auto;padding:24px 20px 56px}
.rowh{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}
.rowh select{width:auto}
.fbar{display:flex;gap:10px;align-items:center;margin:4px 0 12px;flex-wrap:wrap}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.thumbs a{display:block;border:1px solid var(--bd);border-radius:3px;overflow:hidden;background:var(--bg)}
.thumbs img{display:block;height:110px;max-width:220px;object-fit:cover}
.docs{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.docs a{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:3px;padding:6px 10px;text-decoration:none;color:var(--tx);overflow-wrap:anywhere}
.docs a:hover{background:var(--hov)}
.docs .ext{background:var(--acbg);color:var(--ac);border-radius:3px;padding:0 6px;font-size:11px;font-weight:700;text-transform:uppercase}
.docs .sz{color:var(--mut);font-size:12px;margin-left:auto;white-space:nowrap}
.arow{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--bd);border-radius:3px;padding:4px 8px;margin-top:6px;overflow-wrap:anywhere}
.arow button{padding:2px 8px;font-size:12px}
.shd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:18px 0 8px}
.card.past{opacity:.65;border-left-color:var(--bd)}
.card.exam{border-left-color:var(--bad)}
.when{background:var(--okbg);color:var(--ok);border-radius:3px;padding:1px 8px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.when.soon{background:var(--badbg);color:var(--bad)}
#sform{display:none;margin-bottom:16px}
#sform label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
#sform input,#sform textarea,#sform select{width:100%}
#form input[type=file],#sform input[type=file]{padding:6px}
button[disabled]{opacity:.6;cursor:default}
@media (max-width:820px){.shell{grid-template-columns:1fr;gap:16px;padding:16px 12px 40px}.top{padding:0 12px}.top .crumb{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">T</div>
  <span class="name">TSI Updates Hub</span><span class="crumb">/ All updates</span>
  <button id="signin">Sign in</button>
  <button id="add" class="pri" style="display:none">+ Add update</button>
</header>
<nav class="tabbar"><div class="tabin">
  <button class="tab on" data-tab="updates">Updates</button>
  <button class="tab" data-tab="schedule">Schedule</button>
</div></nav>
<div class="shell" id="view-updates">
  <aside class="side">
    <h2>Filter</h2>
    <label for="q">Search</label>
    <input id="q" type="search" placeholder="Title, details or tag">
    <label for="tagf">Tag</label>
    <select id="tagf"><option value="">All tags</option></select>
    <label for="sort">Sort by date created</label>
    <select id="sort"><option value="desc">Newest first</option><option value="asc">Oldest first</option></select>
    <label for="from">Created from</label>
    <input id="from" type="date">
    <label for="to">Created to</label>
    <input id="to" type="date">
    <button id="clear">Clear filters</button>
  </aside>
  <main class="main">
    <h1>All updates</h1>
    <p class="sub">Every TSI update in one place. Search, filter by date created, and share the link.</p>
    <div id="login" class="card" style="display:none">
      <label>Email</label><input id="l-email" type="email" autocomplete="username">
      <label>Password</label><input id="l-pass" type="password" autocomplete="current-password">
      <div id="l-err" class="sub" style="color:#c9372c;margin:8px 0 0"></div>
      <div class="act"><button id="l-go" class="pri">Sign in</button><button id="l-cancel">Cancel</button></div>
    </div>
    <div id="form" class="card">
      <label>Title</label><input id="f-title" maxlength="200">
      <label>Tag (e.g. Process, Tool, QA, Client)</label><input id="f-tag" maxlength="40" list="taglist"><datalist id="taglist"></datalist>
      <label>Date created</label><input id="f-date" type="date">
      <label>Details</label><textarea id="f-det"></textarea>
      <label>Link (optional)</label><input id="f-link" type="url" placeholder="https://">
      <label>Images and documents (optional, up to 20 MB each)</label>
      <input id="f-files" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx,.txt,.zip">
      <div id="f-alist"></div>
      <div class="act"><button id="save" class="pri">Save update</button><button id="cancel">Cancel</button></div>
    </div>
    <div id="count" class="count"></div>
    <div id="list"><div class="note">Loading updates…</div></div>
  </main>
</div>

<div class="shell1" id="view-schedule" style="display:none">
  <div class="rowh">
    <div><h1 style="font-size:24px;font-weight:600;margin:0 0 4px">Training and exam schedule</h1>
    <p class="sub">Dates for team trainings and exams. Dates can be edited anytime, and documents can be attached.</p></div>
    <button id="s-add" class="pri" style="display:none">+ Add schedule</button>
  </div>
  <div id="sform" class="card">
    <label>Title</label><input id="s-title" maxlength="200" placeholder="e.g. Duda eCommerce training">
    <label>Type</label>
    <select id="s-kind"><option>Training</option><option>Exam</option><option>Other</option></select>
    <label>Date</label><input id="s-date" type="date">
    <label>Time (optional)</label><input id="s-time" type="time">
    <label>Notes (optional)</label><textarea id="s-notes" style="min-height:80px"></textarea>
    <label>Documents (optional, up to 20 MB each)</label>
    <input id="s-files" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx,.txt,.zip">
    <div id="s-alist"></div>
    <div class="act"><button id="s-save" class="pri">Save schedule</button><button id="s-cancel">Cancel</button></div>
  </div>
  <div class="fbar">
    <label for="s-kindf" style="font-size:12px;font-weight:600;color:var(--mut)">Show</label>
    <select id="s-kindf"><option value="">All</option><option>Training</option><option>Exam</option><option>Other</option></select>
    <span id="s-count" class="count" style="border:0;margin:0;padding:0"></span>
  </div>
  <div id="s-list"><div class="note">Loading schedule…</div></div>
</div>

<script>
/* ====== CONFIG: paste your Supabase values (Project Settings > API) ====== */
var SUPABASE_URL = "https://efkpbpmcbkbcltapexvs.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_axcZxi0-ULgdttBWQjCA1Q_5u0FS0tg";
/* ======================================================================== */
(function(){
  var items=[],sb=null,canWrite=false,editingId=null,loaded=false;
  var $=function(id){return document.getElementById(id)};
  var q=$("q"),tagf=$("tagf"),sortf=$("sort"),from=$("from"),to=$("to");
  var TABLE="tsi_updates",STABLE="tsi_schedule",BUCKET="tsi-files",MAXB=20*1024*1024;
  var PRESET_TAGS=["Client Issue","Client Update"];
  var sched=[],sLoaded=false,sEditing=null,tab="updates";

  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function fmt(s){var p=(s||"").split("-");if(p.length!==3)return s||"";var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
  function note(msg){var l=$("list");l.innerHTML="";var n=document.createElement("div");n.className="note";n.textContent=msg;l.appendChild(n)}


  function esc(n){return String(n||"")}
  function isImg(a){return /^image\//i.test(a.type||"")||/\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(a.name||"")}
  function safeUrl(u){return /^https?:\/\//i.test(u||"")}
  function sz(n){n=+n||0;return n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"}
  function normAtt(v){return Array.isArray(v)?v.filter(function(a){return a&&safeUrl(a.url)}).map(function(a){return{name:String(a.name||"file"),url:String(a.url),path:String(a.path||""),type:String(a.type||""),size:+a.size||0}}):[]}
  function tagCls(t){var l=(t||"").toLowerCase();return l==="client issue"?"tag bad":l==="client update"?"tag good":"tag"}

  function renderAtt(parent,list){
    if(!list||!list.length)return;
    var imgs=list.filter(isImg),docs=list.filter(function(a){return !isImg(a)});
    if(imgs.length){
      var t=document.createElement("div");t.className="thumbs";
      imgs.forEach(function(a){
        var l=document.createElement("a");l.href=a.url;l.target="_blank";l.rel="noopener noreferrer";l.title=a.name;
        var im=document.createElement("img");im.src=a.url;im.alt=a.name;im.loading="lazy";l.appendChild(im);t.appendChild(l);
      });
      parent.appendChild(t);
    }
    if(docs.length){
      var d=document.createElement("div");d.className="docs";
      docs.forEach(function(a){
        var l=document.createElement("a");l.href=a.url;l.target="_blank";l.rel="noopener noreferrer";
        var ext=document.createElement("span");ext.className="ext";ext.textContent=((a.name.split(".").pop()||"file").slice(0,5));
        var nm=document.createElement("span");nm.textContent=a.name;
        var s2=document.createElement("span");s2.className="sz";s2.textContent=sz(a.size);
        l.appendChild(ext);l.appendChild(nm);l.appendChild(s2);d.appendChild(l);
      });
      parent.appendChild(d);
    }
  }

  function attEditor(listEl,inputEl){
    var st={existing:[],pending:[],removed:[]};
    function row(name,fn){
      var d=document.createElement("div");d.className="arow";
      var n=document.createElement("span");n.textContent=name;
      var b=document.createElement("button");b.type="button";b.textContent="Remove";b.onclick=fn;
      d.appendChild(n);d.appendChild(b);listEl.appendChild(d);
    }
    function draw(){
      listEl.innerHTML="";
      st.existing.forEach(function(a,i){row(a.name,function(){st.removed.push(st.existing.splice(i,1)[0]);draw()})});
      st.pending.forEach(function(f,i){row(f.name+" (new, "+sz(f.size)+")",function(){st.pending.splice(i,1);draw()})});
    }
    inputEl.addEventListener("change",function(){
      Array.prototype.forEach.call(inputEl.files,function(f){
        if(f.size>MAXB){alert(f.name+" is over 20 MB and was skipped.");return}
        st.pending.push(f);
      });
      inputEl.value="";draw();
    });
    return{st:st,set:function(arr){st.existing=normAtt(arr);st.pending=[];st.removed=[];draw()}};
  }

  async function uploadAll(files,folder){
    var out=[];
    for(var i=0;i<files.length;i++){
      var f=files[i];
      var path=folder+"/"+Date.now()+"-"+i+"-"+f.name.replace(/[^\w.\-]+/g,"_");
      var r=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||"application/octet-stream",upsert:false});
      if(r.error)throw new Error(f.name+": "+r.error.message);
      out.push({name:f.name,url:sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl,path:path,type:f.type||"",size:f.size});
    }
    return out;
  }
  function removeFiles(list){
    var paths=(list||[]).map(function(a){return a.path}).filter(Boolean);
    if(paths.length)sb.storage.from(BUCKET).remove(paths).catch(function(){});
  }
  var uAtt=attEditor($("f-alist"),$("f-files"));
  var sAtt=attEditor($("s-alist"),$("s-files"));

  function hl(el,text,term){
    if(!term){el.textContent=text;return}
    var lo=text.toLowerCase(),t=term.toLowerCase(),i=0,j;
    while((j=lo.indexOf(t,i))>-1){
      el.appendChild(document.createTextNode(text.slice(i,j)));
      var m=document.createElement("mark");m.textContent=text.slice(j,j+t.length);el.appendChild(m);
      i=j+t.length;
    }
    el.appendChild(document.createTextNode(text.slice(i)));
  }

  function refreshTags(){
    var cur=tagf.value,set={};
    PRESET_TAGS.forEach(function(p){set[p]=1});
    items.forEach(function(u){if(u.tag)set[u.tag]=1});
    var tags=Object.keys(set).sort();
    tagf.innerHTML="";
    var o=document.createElement("option");o.value="";o.textContent="All tags";tagf.appendChild(o);
    var dl=$("taglist");dl.innerHTML="";
    tags.forEach(function(t){
      var a=document.createElement("option");a.value=t;a.textContent=t;tagf.appendChild(a);
      var b=document.createElement("option");b.value=t;dl.appendChild(b);
    });
    tagf.value=tags.indexOf(cur)>-1?cur:"";
  }

  function render(){
    var term=q.value.trim(),t=term.toLowerCase();
    var rows=items.filter(function(u){
      if(tagf.value&&u.tag!==tagf.value)return false;
      if(from.value&&u.date<from.value)return false;
      if(to.value&&u.date>to.value)return false;
      if(t&&(u.title+" "+u.details+" "+u.tag+" "+u.attachments.map(function(a){return a.name}).join(" ")).toLowerCase().indexOf(t)<0)return false;
      return true;
    });
    var dir=sortf.value==="asc"?1:-1;
    rows.sort(function(a,b){return a.date===b.date?(a.created-b.created)*dir:(a.date<b.date?-1:1)*dir});
    var list=$("list");list.innerHTML="";
    var latestId=null,latestT=-1;
    items.forEach(function(x){var tt=x.updated||x.created;if(tt>latestT){latestT=tt;latestId=x.id}});
    $("count").textContent=loaded?rows.length+" of "+items.length+" updates":"";
    if(!rows.length){
      var e=document.createElement("div");e.className="empty";
      e.textContent=!loaded?"Loading updates…":(items.length?"No updates match your filters.":"No updates yet."+(canWrite?" Use “Add update” to post the first one.":""));
      list.appendChild(e);return;
    }
    rows.forEach(function(u){
      var c=document.createElement("div");c.className="card";
      var h=document.createElement("h3");hl(h,u.title,term);c.appendChild(h);
      var m=document.createElement("div");m.className="meta";
      var d=document.createElement("span");d.textContent="Created "+fmt(u.date);m.appendChild(d);
      if(u.tag){var g=document.createElement("span");g.className=tagCls(u.tag);g.textContent=u.tag;m.appendChild(g)}
      var vs=document.createElement("span");vs.className="ver";vs.textContent="v"+u.version;m.appendChild(vs);
      if(u.updated){var us=document.createElement("span");us.textContent="Updated "+new Date(u.updated).toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});m.appendChild(us)}
      if(u.id===latestId){var ls=document.createElement("span");ls.className="latest";ls.textContent="Latest";m.appendChild(ls)}
      c.appendChild(m);
      var p=document.createElement("div");p.className="det";hl(p,u.details,term);c.appendChild(p);
      if(u.link&&/^https?:\/\//i.test(u.link)){
        var a=document.createElement("a");a.href=u.link;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Open link";
        var w=document.createElement("div");w.style.marginTop="8px";w.appendChild(a);c.appendChild(w);
      }
      renderAtt(c,u.attachments);
      if(canWrite){
        var ac=document.createElement("div");ac.className="act";
        var eb=document.createElement("button");eb.textContent="Edit";eb.onclick=function(){openForm(u)};
        var db2=document.createElement("button");db2.textContent="Delete";db2.onclick=async function(){
          if(!confirm("Delete this update?"))return;
          var r=await sb.from(TABLE).delete().eq("id",u.id);
          if(r.error)alert("Could not delete: "+r.error.message);else{removeFiles(u.attachments);load()}
        };
        ac.appendChild(eb);ac.appendChild(db2);c.appendChild(ac);
      }
      if(u.history&&u.history.length){
        var hb=document.createElement("button");hb.textContent="History ("+u.history.length+")";hb.style.cssText="margin-top:10px;padding:3px 10px;font-size:12px";
        var hp=document.createElement("div");hp.className="hist";hp.style.display="none";
        u.history.slice().reverse().forEach(function(h){
          var r=document.createElement("div");r.className="h";
          var hd=document.createElement("div");hd.textContent="v"+h.v+" · saved "+new Date(h.savedAt).toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
          var tb=document.createElement("b");tb.textContent=h.title;
          var bd=document.createElement("div");bd.className="det";bd.textContent=h.details;
          r.appendChild(hd);r.appendChild(tb);r.appendChild(bd);hp.appendChild(r);
        });
        hb.onclick=function(){hp.style.display=hp.style.display==="none"?"block":"none"};
        c.appendChild(hb);c.appendChild(hp);
      }
      list.appendChild(c);
    });
  }

  function openForm(u){
    editingId=u?u.id:null;
    $("login").style.display="none";
    $("f-title").value=u?u.title:"";$("f-tag").value=u?u.tag:"";
    $("f-date").value=u?u.date:today();$("f-det").value=u?u.details:"";$("f-link").value=u?u.link:"";
    uAtt.set(u?u.attachments:[]);
    $("form").style.display="block";$("f-title").focus();
  }
  function closeForm(){$("form").style.display="none";editingId=null}

  $("add").onclick=function(){openForm(null)};
  $("cancel").onclick=closeForm;
  $("clear").onclick=function(){q.value="";tagf.value="";from.value="";to.value="";sortf.value="desc";render()};
  [q,tagf,sortf,from,to].forEach(function(el){el.addEventListener("input",render)});

  $("save").onclick=async function(){
    var title=$("f-title").value.trim(),det=$("f-det").value.trim();
    if(!title||!det){alert("Please add a title and details.");return}
    var existing=items.filter(function(x){return x.id===editingId})[0];
    var id=editingId||("u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    var btn=$("save");btn.disabled=true;btn.textContent="Saving…";
    var atts;
    try{atts=uAtt.st.existing.concat(await uploadAll(uAtt.st.pending,"updates/"+id))}
    catch(err){alert("Upload failed: "+err.message);btn.disabled=false;btn.textContent="Save update";return}
    var rec={id:id,title:title,tag:$("f-tag").value.trim(),date:$("f-date").value||today(),details:det,link:$("f-link").value.trim(),created:existing?existing.created:Date.now(),version:1,updated:0,history:[]};
    if(atts.length||(existing&&existing.attachments.length))rec.attachments=atts;
    if(existing){rec.version=(existing.version||1)+1;rec.updated=Date.now();rec.history=(existing.history||[]).concat([{v:existing.version||1,title:existing.title,tag:existing.tag,date:existing.date,details:existing.details,link:existing.link,savedAt:existing.updated||existing.created}]).slice(-20);}
    var r=await sb.from(TABLE).upsert(rec);
    btn.disabled=false;btn.textContent="Save update";
    if(r.error){alert("Could not save: "+r.error.message);return}
    removeFiles(uAtt.st.removed);
    closeForm();load();
  };


  /* ---- tabs ---- */
  function syncBtns(){
    $("add").style.display=(canWrite&&tab==="updates")?"inline-block":"none";
    $("s-add").style.display=canWrite?"inline-block":"none";
  }
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){
    b.onclick=function(){
      tab=b.getAttribute("data-tab");
      Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(x){x.classList.toggle("on",x===b)});
      $("view-updates").style.display=tab==="updates"?"":"none";
      $("view-schedule").style.display=tab==="schedule"?"":"none";
      $("login").style.display="none";
      document.querySelector(".crumb").textContent=tab==="updates"?"/ All updates":"/ Schedule";
      syncBtns();
    };
  });

  /* ---- schedule ---- */
  function fmtTime(t){if(!t)return"";var p=t.split(":");var h=+p[0],m=p[1]||"00";return(h%12||12)+":"+m+" "+(h>=12?"PM":"AM")}
  function dayDiff(d){var p=d.split("-");if(p.length!==3)return null;var a=new Date(+p[0],+p[1]-1,+p[2]),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((a-n)/86400000)}
  function renderSched(){
    var list=$("s-list");list.innerHTML="";
    var k=$("s-kindf").value;
    var rows=sched.filter(function(x){return !k||x.kind===k});
    $("s-count").textContent=sLoaded?rows.length+" of "+sched.length+" scheduled":"";
    if(!rows.length){
      var e=document.createElement("div");e.className="empty";
      e.textContent=!sLoaded?"Loading schedule…":(sched.length?"Nothing matches this filter.":"No trainings or exams scheduled yet."+(canWrite?" Use “Add schedule” to add one.":""));
      list.appendChild(e);return;
    }
    var td=today();
    var up=rows.filter(function(x){return (x.date||"9999")>=td}).sort(function(a,b){return (a.date+(a.time||"")).localeCompare(b.date+(b.time||""))});
    var pa=rows.filter(function(x){return (x.date||"9999")<td}).sort(function(a,b){return (b.date+(b.time||"")).localeCompare(a.date+(a.time||""))});
    function group(title,arr,past){
      if(!arr.length)return;
      var h=document.createElement("div");h.className="shd";h.textContent=title;list.appendChild(h);
      arr.forEach(function(x){
        var c=document.createElement("div");c.className="card"+(past?" past":"")+(x.kind==="Exam"?" exam":"");
        var h3=document.createElement("h3");h3.textContent=x.title;c.appendChild(h3);
        var m=document.createElement("div");m.className="meta";
        var tg=document.createElement("span");tg.className=x.kind==="Exam"?"tag bad":"tag";tg.textContent=x.kind||"Training";m.appendChild(tg);
        var ds=document.createElement("span");ds.textContent=(x.date?fmt(x.date):"No date")+(x.time?" · "+fmtTime(x.time):"");m.appendChild(ds);
        var dd=x.date?dayDiff(x.date):null;
        if(dd!==null&&!past){var w=document.createElement("span");w.className="when"+(dd<=7?" soon":"");w.textContent=dd===0?"Today":dd===1?"Tomorrow":"In "+dd+" days";m.appendChild(w)}
        if(x.updated){var us=document.createElement("span");us.textContent="Edited "+new Date(x.updated).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});m.appendChild(us)}
        c.appendChild(m);
        if(x.notes){var p=document.createElement("div");p.className="det";p.textContent=x.notes;c.appendChild(p)}
        renderAtt(c,x.attachments);
        if(canWrite){
          var ac=document.createElement("div");ac.className="act";
          var eb=document.createElement("button");eb.textContent="Edit";eb.onclick=function(){openSForm(x)};
          var db2=document.createElement("button");db2.textContent="Delete";db2.onclick=async function(){
            if(!confirm("Delete this schedule?"))return;
            var r=await sb.from(STABLE).delete().eq("id",x.id);
            if(r.error)alert("Could not delete: "+r.error.message);else{removeFiles(x.attachments);loadSched()}
          };
          ac.appendChild(eb);ac.appendChild(db2);c.appendChild(ac);
        }
        list.appendChild(c);
      });
    }
    group("Upcoming",up,false);group("Past",pa,true);
  }
  function openSForm(x){
    sEditing=x?x.id:null;
    $("s-title").value=x?x.title:"";$("s-kind").value=x?(x.kind||"Training"):"Training";
    $("s-date").value=x?x.date:"";$("s-time").value=x?x.time:"";$("s-notes").value=x?x.notes:"";
    sAtt.set(x?x.attachments:[]);
    $("sform").style.display="block";$("s-title").focus();
  }
  function closeSForm(){$("sform").style.display="none";sEditing=null}
  $("s-add").onclick=function(){openSForm(null)};
  $("s-cancel").onclick=closeSForm;
  $("s-kindf").addEventListener("input",renderSched);
  $("s-save").onclick=async function(){
    var title=$("s-title").value.trim(),date=$("s-date").value;
    if(!title||!date){alert("Please add a title and a date.");return}
    var existing=sched.filter(function(x){return x.id===sEditing})[0];
    var id=sEditing||("s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    var btn=$("s-save");btn.disabled=true;btn.textContent="Saving…";
    var atts;
    try{atts=sAtt.st.existing.concat(await uploadAll(sAtt.st.pending,"schedule/"+id))}
    catch(err){alert("Upload failed: "+err.message);btn.disabled=false;btn.textContent="Save schedule";return}
    var rec={id:id,title:title,kind:$("s-kind").value,date:date,time:$("s-time").value,notes:$("s-notes").value.trim(),attachments:atts,created:existing?existing.created:Date.now(),updated:existing?Date.now():0};
    var r=await sb.from(STABLE).upsert(rec);
    btn.disabled=false;btn.textContent="Save schedule";
    if(r.error){alert("Could not save: "+r.error.message+"\n\nIf this says the table does not exist, run the SQL setup in Supabase first.");return}
    removeFiles(sAtt.st.removed);
    closeSForm();loadSched();
  };
  async function loadSched(){
    var r=await sb.from(STABLE).select("*");
    sLoaded=true;
    if(r.error){sched=[];$("s-list").innerHTML="";var n=document.createElement("div");n.className="note";n.textContent="Schedule is not set up yet. Run the SQL setup in Supabase (table tsi_schedule).";$("s-list").appendChild(n);return}
    sched=r.data.map(function(x){return{id:String(x.id),title:String(x.title||""),kind:String(x.kind||"Training"),date:String(x.date||""),time:String(x.time||""),notes:String(x.notes||""),attachments:normAtt(x.attachments),created:+x.created||0,updated:+x.updated||0}});
    renderSched();
  }

  /* ---- auth ---- */
  function setAuth(session){
    canWrite=!!session;
    syncBtns();
    $("signin").textContent=canWrite?"Sign out":"Sign in";
    if(!canWrite){closeForm();closeSForm()}
    render();renderSched();
  }
  $("signin").onclick=async function(){
    if(canWrite){await sb.auth.signOut();return}
    closeForm();$("l-err").textContent="";$("login").style.display="block";$("l-email").focus();
  };
  $("l-cancel").onclick=function(){$("login").style.display="none"};
  async function doLogin(){
    var r=await sb.auth.signInWithPassword({email:$("l-email").value.trim(),password:$("l-pass").value});
    if(r.error){$("l-err").textContent=r.error.message;return}
    $("l-pass").value="";$("login").style.display="none";
  }
  $("l-go").onclick=doLogin;
  $("l-pass").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});

  /* ---- data ---- */
  async function load(){
    var r=await sb.from(TABLE).select("*");
    if(r.error){loaded=true;note("Could not load updates: "+r.error.message);return}
    items=r.data.map(function(x){return{id:String(x.id),title:String(x.title||""),tag:String(x.tag||""),date:String(x.date||""),details:String(x.details||""),link:String(x.link||""),created:+x.created||0,version:+x.version||1,updated:+x.updated||0,history:Array.isArray(x.history)?x.history:[],attachments:normAtt(x.attachments)}});
    loaded=true;refreshTags();render();
  }

  (async function(){
    if(!window.supabase||SUPABASE_URL.indexOf("YOUR-PROJECT")>-1){note("Setup needed: add your Supabase URL and anon key at the top of the script in index.html.");return}
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    var s=await sb.auth.getSession();
    setAuth(s.data&&s.data.session);
    sb.auth.onAuthStateChange(function(_e,session){setAuth(session)});
    await load();loadSched();
    sb.channel("tsi_schedule_live").on("postgres_changes",{event:"*",schema:"public",table:STABLE},function(){loadSched()}).subscribe();
    sb.channel("tsi_updates_live").on("postgres_changes",{event:"*",schema:"public",table:TABLE},function(){load()}).subscribe();
  })();
})();
</script>
</body>
</html>
